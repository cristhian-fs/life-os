server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Client-side routing (TanStack Router) — any path that isn't a real
  # file falls back to index.html so the router can take over.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Vite hashes asset filenames on every build, so these are safe to cache
  # forever; index.html itself is never cached (default headers, always
  # revalidated) so a new deploy is picked up on next load.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
